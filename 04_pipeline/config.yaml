# JPM2KG NL-to-Cypher evaluation — public configuration
#
# No credentials in this file. The password is read from the NEO4J_PASSWORD
# environment variable; see .env.example.
#
# All paths are relative to the repository root.

project_name: JPM2KG_QueryGen
version: "2.1"
scope: "Japan (single-domain case study with transferable DKB design)"

neo4j:
  uri: bolt://localhost:37689        # host port 37689 -> container port 7687
  username: neo4j
  password_env: NEO4J_PASSWORD       # value is never stored here
  database: neo4j
  container: jpm2kg-neo4j
  description: "JPM2KG — 1,116 stations, 71,149,372 hourly PM2.5 observations (2018-2026)"

ollama:
  base_url: http://localhost:11434
  timeout_seconds: 60                # 120 was used for qwen2.5:72b
  retry_attempts: 2
  # The four models reported in the paper.
  models:
    - llama3.2:3b
    - gemma2:9b
    - qwen2.5-coder:32b
    - qwen2.5:72b
  # Generation settings; see 06_environment/models_and_generation.md
  generation:
    temperature: 0.0
    num_ctx: 8192
    num_predict: 512
    stream: false
    think: false
    keep_alive: 30m
    seed: null                       # no seed was pinned

finetuned_baseline:
  checkpoint: neo4j/text2cypher-gemma-2-9b-it-finetuned-2024v1
  runtime: huggingface_transformers
  quantization: 4-bit NF4, double quantization, bfloat16 compute
  do_sample: false
  max_new_tokens: 256

retrieval:
  # DKB+Hybrid exemplar retrieval. k was fixed a priori at 3; see
  # 05_results/camera_ready/k_sensitivity/ for the sensitivity analysis.
  model: all-MiniLM-L6-v2
  k: 3
  similarity: cosine
  exemplars_in_prompt: 8             # k retrieved + fixed head, truncated to 8

dkb:
  filepath: 03_domain_knowledge_base/dkb_japan.json
  archived_experimental_dkb: 03_domain_knowledge_base/archive/dkb_japan_bda2026_experimental.json

benchmark:
  filepath: 02_benchmark/aircypher150_benchmark.json
  num_queries: 150

results:
  raw_results: 05_results/raw/results_full.jsonl     # immutable historical output
  camera_ready_dir: 05_results/camera_ready/
  tables_dir: 05_results/tables/

systems:
  # The six prompting configurations, with the labels used in the paper tables.
  baseline:           Baseline
  cypherbench_style:  Schema
  schema_plus_values: Schema+Values
  dkb_no_examples:    DKB-NoExamples
  dkb:                DKB
  dkb_hybrid:         DKB+Hybrid
