# Japan PM2.5 NL-to-Cypher Query Generation System
project_name: Japan_PM25_QueryGen
version: "2.0"
scope: "Japan (single-domain case study with transferable DKB design)"

neo4j:
  uri: bolt://localhost:37689        # jp-pm25-neo4j container (host port 37689 → 7687)
  username: neo4j
  password: StrongPasswordHere
  database: neo4j
  container: jp-pm25-neo4j
  kg_type: japan_pm25
  description: "Japan PM2.5 monitoring KG — 1,116 stations, 71M hourly readings (2018–2026), cleaned Japan-only"

ollama:
  base_url: http://localhost:11434
  # Primary model for smoke test and single-LLM evaluation runs.
  # Re-selected 2026-06-21 on QUALITY, not just speed:
  #   - llama3:8B          fast (~2s) but emits INVALID Cypher (e.g. SQL GROUP BY) -> unusable
  #   - qwen2.5-coder:32b  valid Cypher, ~4.4s warm (cold load ~21s)  <- chosen (reliability)
  #   - codestral:latest   valid Cypher, ~1.4s warm (cold load ~39s)  <- fast alternative
  # NOTE: llama3:8B and llama3:latest are the SAME model id (365c0bd3c000); the
  # earlier "170s" was the long CypherBench schema prompt, not the model.
  primary_model: qwen2.5-coder:32b
  fast_alternative: codestral:latest
  timeout: 60
  models:
    cypher:    hmahmood/neo4j-gemma-3-27b-inst-q8  # fine-tuned for Neo4j Cypher
    general:   qwen3.5:9b
    large:     qwen3.5:35b
    code:      qwen2.5-coder:32b
    embedding: embeddinggemma:latest
    evaluation_models:
      - llama3:8B
      - qwen2.5:7b
      - qwen2.5-coder:32b
      - deepseek-coder:33b
  timeout_seconds: 60
  retry_attempts: 2

dkb:
  filepath: /home/arjun/pm25_system/data/dkb_japan.json
  transferability_doc: /home/arjun/pm25_system/data/TRANSFERABILITY.md
  description: "Domain Knowledge Base for Japan PM2.5 KG — v2.0, Japan-only"

benchmark:
  filepath: /home/arjun/pm25_system/benchmarks/benchmark.json
  system_queries_file: /home/arjun/pm25_system/benchmarks/system_queries.json
  human_queries_file: /home/arjun/pm25_system/benchmarks/human_queries.json
  num_system_queries: 300
  num_human_queries: 100

results:
  output_dir: /home/arjun/pm25_system/results/
  results_file: results_raw.jsonl
  summary_tables_file: summary_tables.csv
  plots_dir: /home/arjun/pm25_system/results/plots/
  statistical_analysis_file: statistical_analysis.txt

paths:
  root: /home/arjun/pm25_system
  data_dir: /home/arjun/pm25_system/data/
  benchmark_dir: /home/arjun/pm25_system/benchmarks/
  kg_builders_dir: /home/arjun/pm25_system/kg_builders/
  pipeline_dir: /home/arjun/pm25_system/pipeline/
  utils_dir: /home/arjun/pm25_system/utils/
  results_dir: /home/arjun/pm25_system/results/
  cleanup_dir: /home/arjun/pm25_system/cleanup/
